<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Support Desk — Partner-Client Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; padding: 20px; background: #f7f7f8; color: #1f2937; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    button { cursor: pointer; padding: 6px 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; font-size: 13px; }
    button:hover { background: #f3f4f6; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    button.primary:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; color: #fff; border-color: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    input, select, textarea { font-family: inherit; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .banner { background: #fef3c7; border: 1px solid #fcd34d; padding: 10px 12px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .layout { display: grid; grid-template-columns: 380px 1fr; gap: 16px; align-items: start; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }
    .panel-head { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: center; }
    .tabs { display: flex; gap: 4px; }
    .tab { padding: 5px 10px; border-radius: 6px; font-size: 13px; border: 1px solid transparent; background: none; }
    .tab.active { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; font-weight: 600; }
    .list { max-height: 62vh; overflow-y: auto; }
    .row { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
    .row:hover { background: #f9fafb; }
    .row.active { background: #eff6ff; }
    .row.inert { cursor: default; color: #9ca3af; }
    .row.inert:hover { background: none; }
    .row-main { flex: 1; min-width: 0; }
    .row-name { font-weight: 600; font-size: 13px; }
    .row-sub { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { background: #dc2626; color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
    .pill { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #f3f4f6; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
    .messages { height: 55vh; overflow-y: auto; padding: 14px; background: #fafafa; }
    .msg { margin-bottom: 12px; max-width: 78%; }
    .msg .bubble { padding: 8px 12px; border-radius: 12px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg .meta { font-size: 11px; color: #9ca3af; margin-top: 3px; }
    .msg.CLIENT { margin-right: auto; }
    .msg.CLIENT .bubble { background: #fff; border: 1px solid #e5e7eb; }
    .msg.PARTNER, .msg.SUPPORT, .msg.SYSTEM { margin-left: auto; text-align: right; }
    .msg.PARTNER .bubble { background: #dcfce7; border: 1px solid #bbf7d0; }
    .msg.SUPPORT .bubble { background: #dbeafe; border: 1px solid #bfdbfe; }
    .msg.SYSTEM .bubble { background: #f3f4f6; border: 1px solid #e5e7eb; color: #6b7280; }
    .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7eb; }
    .composer input { flex: 1; }
    .empty { padding: 28px 14px; text-align: center; color: #9ca3af; font-size: 13px; }
    .status { font-size: 12px; color: #6b7280; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; margin-right: 5px; }
    .dot.on { background: #16a34a; }
    .group-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer;
                  background: #fafafa; border-bottom: 1px solid #eef0f2; user-select: none; }
    .group-head:hover { background: #f3f4f6; }
    .group-head .chev { width: 12px; color: #9ca3af; font-size: 10px; transition: transform .12s; }
    .group-head.open .chev { transform: rotate(90deg); }
    .group-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-count { font-size: 11px; color: #9ca3af; }
    .group-head.unassigned { background: #fffbeb; }
    .group-head.unassigned:hover { background: #fef3c7; }
    .child { padding-left: 30px; }
    .child .row-name { font-weight: 500; }
    .pill.st-OPEN { background: #fef3c7; color: #92400e; }
    .pill.st-IN_PROGRESS { background: #dbeafe; color: #1d4ed8; }
    .pill.st-RESOLVED { background: #dcfce7; color: #166534; }
    .detail { padding: 14px; max-height: 70vh; overflow-y: auto; font-size: 13px; }
    .detail p { margin: 0 0 6px; }
    .detail h4 { margin: 16px 0 6px; font-size: 13px; }
    .detail textarea, .detail input { width: 100%; margin-bottom: 6px; }
    .desc { white-space: pre-wrap; word-break: break-word; background: #fafafa; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .thumbs img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #e5e7eb; }
    .event { border-left: 2px solid #e5e7eb; padding: 2px 0 8px 10px; }
    .event .desc { margin-top: 4px; padding: 6px 8px; }
    .err { color: #dc2626; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Support Desk — Partner-Client Chat</h1>
  <!--
  <div class="banner">
    Serve this page from an origin listed in <code>CORS_ORIGINS</code> (e.g.
    <code>http://localhost:5000</code>). Opening it as <code>file://</code> sends
    <code>Origin: null</code> and every API call will fail CORS.
    Sign in with a phone listed in <code>SUPPORT_PHONES</code> or <code>ADMIN_PHONES</code>.
  </div>
-->
  <div id="authSection" class="panel" style="padding:14px; max-width:420px;">
    <div style="margin-bottom:10px;">
      <input id="phone" placeholder="Support phone"  />
      <button onclick="requestOtp()">Request OTP</button>
    </div>
    <div>
      <input id="otp" placeholder="OTP" />
      <button class="primary" onclick="verifyOtp()">Sign in</button>
    </div>
    <div id="authError" style="color:#dc2626; font-size:12px; margin-top:10px;"></div>
  </div>

  <div id="mainSection" style="display:none;">
    <p class="status" style="margin-top:0;">
      Signed in as <strong id="supportPhone"></strong>
      &nbsp;·&nbsp; <span id="connState"><span class="dot"></span>not connected</span>
      &nbsp;·&nbsp; <button onclick="logout()">Sign out</button>
    </p>

    <div class="layout">
      <div class="panel">
        <div class="panel-head">
          <div class="tabs">
            <button class="tab active" id="tabChats" onclick="switchTab('chats')">Conversations</button>
            <button class="tab" id="tabClients" onclick="switchTab('clients')">All clients</button>
            <button class="tab" id="tabTickets" onclick="switchTab('tickets')">Tickets</button>
          </div>
          <div style="margin-left:auto;"><button onclick="reloadActiveTab()">Refresh</button></div>
        </div>
        <div id="clientSearchBar" class="panel-head" style="display:none;">
          <input id="clientSearch" placeholder="Search name or phone" style="flex:1;"
                 onkeydown="if(event.key==='Enter') loadClients()" />
          <button onclick="loadClients()">Search</button>
        </div>
        <div id="ticketBar" style="display:none;">
          <div id="ticketFilters" class="panel-head tabs" style="flex-wrap:wrap;"></div>
          <div class="panel-head">
            <select id="ticketCategory" onchange="loadTickets({ page: 1 })">
              <option value="">All categories</option>
            </select>
            <input id="ticketSearch" placeholder="MTP-12, name or phone" style="flex:1; min-width:0;"
                   onkeydown="if(event.key==='Enter') loadTickets({ page: 1 })" />
          </div>
        </div>
        <div id="list" class="list"></div>
      </div>

      <div class="panel" id="ticketPanel" style="display:none;">
        <div class="panel-head">
          <strong id="ticketTitle" style="font-size:14px;">No ticket selected</strong>
        </div>
        <div id="ticketDetail" class="detail">
          <div class="empty">Pick a ticket on the left.</div>
        </div>
      </div>

      <div class="panel" id="chatPanel">
        <div class="panel-head">
          <strong id="chatTitle" style="font-size:14px;">No conversation selected</strong>
          <span id="chatSub" class="status" style="margin-left:auto;"></span>
          <button id="closeChatBtn" class="danger" onclick="closeChat()"
                  style="display:none;"
                  title="Close this conversation">&#10005; Close</button>
        </div>
        <div id="messages" class="messages">
          <div class="empty">Pick a conversation on the left.</div>
        </div>
        <div class="composer">
          <input id="replyBody" placeholder="Type a reply as SUPPORT"
                 onkeydown="if(event.key==='Enter') sendReply()" disabled />
          <button class="primary" id="sendBtn" onclick="sendReply()" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const API = 'https://staging.multiplyy.co.in/api/v1';
    const SOCKET_URL = 'https://staging.multiplyy.co.in/api/v1/chat';
    // Same server as the chat socket, ticket-updates namespace.
    const DESK_SOCKET_URL = SOCKET_URL.replace(/\/chat$/, '/support-desk');

    let token = localStorage.getItem('supportToken') || '';
    let socket = null;
    let currentConversationId = null;
    let currentTab = 'chats';
    let conversations = [];
    let clients = [];
    // Ids already drawn in the chat pane. Both the live connection and the
    // HTTP check add messages, so this stops the same one appearing twice.
    let shownMessageIds = new Set();
    let chatPollTimer = null;
    // True only after the server confirms we joined the chat. A connected
    // socket that failed to join delivers nothing, so it does not count.
    let socketLive = false;
    let clientsLoaded = false;
    // Partner ids (or UNASSIGNED) the operator has opened. Kept outside the
    // render so the periodic refresh never collapses the tree under them.
    const expandedGroups = new Set();
    const UNASSIGNED = '__unassigned__';
    let pollTimer = null;
    // Long-lived socket for live ticket updates (the chat socket reconnects per thread).
    let deskSocket = null;

    // --- API helpers -----------

    async function api(path, options = {}) {
      const res = await fetch(API + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: 'Bearer ' + token } : {}),
          ...(options.headers || {}),
        },
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(json?.error?.message || json?.message || ('HTTP ' + res.status));
      }
      return json;
    }

    // --- Auth ---------

    // verify-otp must echo back the requestId that send-otp returned.
    let otpRequestId = null;

    async function requestOtp() {
      const phone = document.getElementById('phone').value.trim();
      try {
        const result = await api('/auth/send-otp', { method: 'POST', body: JSON.stringify({ phone }) });
        otpRequestId = result.data?.requestId ?? null;
        setAuthError('OTP sent.');
      } catch (e) {
        setAuthError(e.message);
      }
    }

    async function verifyOtp() {
      const phone = document.getElementById('phone').value.trim();
      const otp = document.getElementById('otp').value.trim();
      if (!otpRequestId) {
        setAuthError('Request an OTP first.');
        return;
      }
      try {
        const result = await api('/auth/verify-otp', {
          method: 'POST',
          body: JSON.stringify({ phone, otp, requestId: otpRequestId }),
        });
        if (!result.data?.sessionToken) throw new Error('No session token returned');
        token = result.data.sessionToken;
        localStorage.setItem('supportToken', token);
        localStorage.setItem('supportPhone', phone);
        showMain();
      } catch (e) {
        setAuthError(e.message);
      }
    }

    function setAuthError(msg) {
      document.getElementById('authError').textContent = msg;
    }

    function logout() {
      localStorage.removeItem('supportToken');
      localStorage.removeItem('supportPhone');
      if (socket) socket.disconnect();
      if (deskSocket) deskSocket.disconnect();
      if (pollTimer) clearInterval(pollTimer);
      stopChatPolling();
      location.reload();
    }

    function showMain() {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('mainSection').style.display = 'block';
      document.getElementById('supportPhone').textContent =
        localStorage.getItem('supportPhone') || '';
      switchTab('tickets');
      connectDesk();
      // Keep unread badges fresh while the operator is reading another thread.
      // Tickets also arrive live over the desk socket, but staging's proxy may
      // not carry sockets, so the list keeps a 15s HTTP refresh as well.
      pollTimer = setInterval(() => {
        if (currentTab === 'chats') loadConversations({ quiet: true });
        else if (currentTab === 'clients') loadClients({ quiet: true });
        else loadTickets({ quiet: true });
      }, 15000);
    }

    // The backend pushes { ticketId, change } to support staff whenever a
    // ticket is raised or changes; we refetch through the normal API.
    function connectDesk() {
      deskSocket = io(DESK_SOCKET_URL, { auth: { token }, transports: ['websocket'] });
      deskSocket.on('ticket_updated', ({ ticketId }) => {
        if (currentTab !== 'tickets') return;
        loadTickets({ quiet: true });
        // Don't wipe a reply the operator is still typing.
        const typing = [...document.querySelectorAll('#ticketDetail input, #ticketDetail textarea')]
          .some((el) => el.value.trim());
        if (ticketId === currentTicketId && !typing) openTicket(ticketId);
      });
    }

    // --- Lists ----------

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabChats').classList.toggle('active', tab === 'chats');
      document.getElementById('tabClients').classList.toggle('active', tab === 'clients');
      document.getElementById('clientSearchBar').style.display =
        tab === 'clients' ? 'flex' : 'none';
      document.getElementById('tabTickets').classList.toggle('active', tab === 'tickets');
      document.getElementById('ticketBar').style.display = tab === 'tickets' ? '' : 'none';
      document.getElementById('ticketPanel').style.display = tab === 'tickets' ? '' : 'none';
      document.getElementById('chatPanel').style.display = tab === 'tickets' ? 'none' : '';
      reloadActiveTab();
    }

    function reloadActiveTab() {
      if (currentTab === 'chats') loadConversations();
      else if (currentTab === 'clients') loadClients();
      else loadTickets();
    }

    function renderActiveTab() {
      if (currentTab === 'chats') renderConversations();
      else if (currentTab === 'tickets') renderTickets();
      else if (clientsLoaded) renderClients();
    }

    /** Unread counts live on the conversation payload, keyed by conversation id. */
    function unreadByConversation() {
      return new Map(conversations.map((c) => [c.id, c.unreadFromClient || 0]));
    }

    async function loadConversations(opts = {}) {
      try {
        const result = await api('/partner-client-chat/support/conversations');
        conversations = result.data || [];
        renderActiveTab();
      } catch (e) {
        if (!opts.quiet) renderError(e.message);
      }
    }

    function renderConversations() {
      const list = document.getElementById('list');
      if (conversations.length === 0) {
        list.innerHTML = '<div class="empty">No conversations yet.</div>';
        return;
      }
      list.innerHTML = '';
      conversations.forEach((c) => {
        const row = document.createElement('div');
        row.className = 'row' + (c.id === currentConversationId ? ' active' : '');
        row.onclick = () => openChat(c.id, describeClient(c.client), c);

        const name = describeClient(c.client);
        const preview = c.lastMessage
          ? '[' + c.lastMessage.senderRole + '] ' + c.lastMessage.body
          : 'No messages yet';
        const when = c.lastMessage ? formatTime(c.lastMessage.createdAt) : '';

        row.innerHTML =
          '<div class="row-main">' +
            '<div class="row-name">' + escapeHtml(name) + '</div>' +
            '<div class="row-sub">' + escapeHtml(preview) + '</div>' +
            '<div class="row-sub" style="margin-top:2px;">' +
              '<span class="pill">' + c.status + '</span>' +
              (describePartner(c.partner)
                ? ' <span class="pill" title="Assigned partner">' +
                  escapeHtml(describePartner(c.partner)) + '</span>'
                : ' <span class="pill">no partner</span>') +
              (when ? ' <span style="color:#9ca3af;">' + when + '</span>' : '') +
            '</div>' +
          '</div>' +
          (c.unreadFromClient > 0
            ? '<span class="badge">' + c.unreadFromClient + '</span>'
            : '');
        list.appendChild(row);
      });
    }

    async function loadClients(opts = {}) {
      const search = document.getElementById('clientSearch').value.trim();
      try {
        const qs = search ? '?search=' + encodeURIComponent(search) : '';
        // Unread counts come from the conversation list, so refresh both in one
        // go — otherwise these badges would drift from the Conversations tab.
        const [result] = await Promise.all([
          api('/partner-client-chat/support/clients' + qs),
          loadConversations({ quiet: true }),
        ]);
        clients = result.data || [];
        clientsLoaded = true;
        if (currentTab === 'clients') renderClients();
      } catch (e) {
        if (!opts.quiet) renderError(e.message);
      }
    }

    /**
     * Clients grouped under their assigned partner, unassigned ones first.
     *
     * Unassigned clients are the support desk's own responsibility (nobody else
     * sees those threads), so they lead rather than sit at the bottom.
     */
    function groupClients() {
      const groups = new Map();
      clients.forEach((client) => {
        const key = client.partner ? client.partner.partnerId : UNASSIGNED;
        if (!groups.has(key)) {
          groups.set(key, { key: key, partner: client.partner || null, clients: [] });
        }
        groups.get(key).clients.push(client);
      });

      const ordered = [];
      if (groups.has(UNASSIGNED)) ordered.push(groups.get(UNASSIGNED));
      Array.from(groups.values())
        .filter((g) => g.key !== UNASSIGNED)
        // Stable alphabetical rather than by unread: sorting on unread would
        // make rows jump around under the operator as messages arrive.
        .sort((a, b) =>
          String(describePartner(a.partner) || '').localeCompare(
            String(describePartner(b.partner) || ''),
          ),
        )
        .forEach((g) => ordered.push(g));
      return ordered;
    }

    function toggleGroup(key) {
      if (expandedGroups.has(key)) expandedGroups.delete(key);
      else expandedGroups.add(key);
      renderClients();
    }

    function renderClients() {
      const list = document.getElementById('list');
      if (clients.length === 0) {
        list.innerHTML = '<div class="empty">No clients found.</div>';
        return;
      }

      const unreadMap = unreadByConversation();
      const searching =
        document.getElementById('clientSearch').value.trim().length > 0;

      list.innerHTML = '';
      groupClients().forEach((group) => {
        const unassigned = group.key === UNASSIGNED;
        const label = unassigned
          ? 'Unassigned — handled by support'
          : describePartner(group.partner);

        const groupUnread = group.clients.reduce(
          (sum, c) => sum + (unreadMap.get(c.conversationId) || 0),
          0,
        );
        const holdsOpenChat = group.clients.some(
          (c) => c.conversationId && c.conversationId === currentConversationId,
        );
        // Auto-open while searching (the operator is hunting for someone) and
        // for whichever group holds the conversation on screen.
        const open =
          expandedGroups.has(group.key) || searching || holdsOpenChat;

        const head = document.createElement('div');
        head.className =
          'group-head' + (open ? ' open' : '') + (unassigned ? ' unassigned' : '');
        head.innerHTML =
          '<span class="chev">&#9654;</span>' +
          '<span class="group-name">' + escapeHtml(label) + '</span>' +
          '<span class="group-count">' + group.clients.length + '</span>' +
          (groupUnread > 0 ? '<span class="badge">' + groupUnread + '</span>' : '');
        head.onclick = () => toggleGroup(group.key);
        list.appendChild(head);

        if (!open) return;
        group.clients.forEach((client) => {
          list.appendChild(buildClientRow(client, unreadMap));
        });
      });
    }

    function buildClientRow(client, unreadMap) {
      const row = document.createElement('div');
      const label = describeClient(client);
      const unread = unreadMap.get(client.conversationId) || 0;
      row.className =
        'row child' +
        (client.conversationId && client.conversationId === currentConversationId
          ? ' active'
          : '');

      row.innerHTML =
        '<div class="row-main">' +
          '<div class="row-name">' + escapeHtml(label) + '</div>' +
          '<div class="row-sub">' +
            (client.conversationId
              ? (unread > 0
                  ? unread + ' new message' + (unread === 1 ? '' : 's')
                  : 'Open chat')
              : 'No chat yet') +
          '</div>' +
        '</div>' +
        (unread > 0 ? '<span class="badge">' + unread + '</span>' : '');

      if (client.conversationId) {
        row.onclick = () => openChat(client.conversationId, label);
      } else {
        const start = document.createElement('button');
        start.textContent = 'Start chat';
        start.onclick = (ev) => {
          ev.stopPropagation();
          startChat(client.userId, label);
        };
        row.appendChild(start);
      }
      return row;
    }

    async function startChat(clientUserId, label) {
      try {
        const result = await api(
          '/partner-client-chat/support/clients/' + clientUserId + '/conversation',
          { method: 'POST' },
        );
        const conversationId = result.data?.id;
        if (!conversationId) throw new Error('No conversation returned');
        await loadClients({ quiet: true });
        openChat(conversationId, label);
      } catch (e) {
        renderError(e.message);
      }
    }

    function renderError(msg) {
      document.getElementById('list').innerHTML =
        '<div class="empty" style="color:#dc2626;">' + escapeHtml(msg) + '</div>';
    }

    // --- Chat -----

    function openChat(conversationId, label, conversation) {
      currentConversationId = conversationId;
      shownMessageIds = new Set();
      socketLive = false;

      document.getElementById('chatTitle').textContent = label || 'Conversation';
      const conv = conversation ||
        conversations.find((c) => c.id === conversationId);
      const partnerLabel = describePartner(conv && conv.partner);
      document.getElementById('chatSub').textContent =
        partnerLabel ? 'Partner: ' + partnerLabel : 'No partner';
      document.getElementById('closeChatBtn').style.display = '';
      document.getElementById('messages').innerHTML = '';
      document.getElementById('replyBody').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      renderActiveTab();

      // Load the history over HTTP straight away. This always works, even
      // where the server does not offer a live connection.
      loadThread();

      // Then try to go live. If it connects we switch off the HTTP checking;
      // if it fails we simply keep checking. Either way the chat works.
      connectSocket(conversationId);
      startChatPolling();
    }

    /** Reads the whole chat over HTTP and draws anything new. */
    async function loadThread() {
      const conversationId = currentConversationId;
      if (!conversationId) return;
      try {
        const result = await api('/partner-client-chat/conversations/' + conversationId);
        const messages = (result.data && result.data.messages) || [];
        messages.forEach(appendMessage);
        await markThreadRead(messages);
        loadConversations({ quiet: true });
      } catch (e) {
        // A failed check is not a chat failure — the next one retries.
      }
    }

    /**
     * Tells the server we have read the other side's messages.
     *
     * Joining over the live connection does this by itself, so this is only
     * needed on the HTTP path. Skipped when there is nothing unread.
     */
    async function markThreadRead(messages) {
      const conversationId = currentConversationId;
      if (!conversationId) return;
      const unread = messages.some((m) => m.senderRole !== 'SUPPORT' && !m.readAt);
      if (!unread) return;
      try {
        await api('/partner-client-chat/conversations/' + conversationId + '/read',
          { method: 'PATCH' });
      } catch (e) { /* not important enough to surface */ }
    }

    /** Draws a message once. Ignores ones already on screen. */
    function appendMessage(m) {
      if (!m || !m.id || shownMessageIds.has(m.id)) return;
      shownMessageIds.add(m.id);
      log(m.senderRole, m.body, m.createdAt, m.readAt);
    }

    function startChatPolling() {
      if (chatPollTimer) return;
      chatPollTimer = setInterval(() => {
        if (!socketLive) loadThread();
      }, 4000);
    }

    function stopChatPolling() {
      if (chatPollTimer) clearInterval(chatPollTimer);
      chatPollTimer = null;
    }

    function connectSocket(conversationId) {
      // One chat at a time: reconnecting on switch keeps the server from
      // marking messages read in threads nobody is reading.
      if (socket) socket.disconnect();
      socket = io(SOCKET_URL, { auth: { token }, transports: ['websocket'] });

      socket.on('connect', () => {
        socket.emit('join_conversation', { conversationId });
      });

      socket.on('joined', () => {
        socketLive = true;
        setConnState(true);
      });

      socket.on('disconnect', () => {
        socketLive = false;
        setConnState(false);
      });

      // No live connection available. Not an error the operator needs to see —
      // the HTTP checking below keeps the chat working.
      socket.on('connect_error', () => {
        socketLive = false;
        setConnState(false);
      });

      socket.on('conversation_history', (conv) => {
        (conv.messages || []).forEach(appendMessage);
        loadConversations({ quiet: true });
      });

      socket.on('new_message', (m) => {
        if (m.conversationId !== currentConversationId) return;
        appendMessage(m);
        loadConversations({ quiet: true });
      });

      socket.on('message_read', () => loadConversations({ quiet: true }));

      socket.on('error', (err) => {
        socketLive = false;
        log('SYSTEM', 'Error: ' + (err && err.message ? err.message : JSON.stringify(err)), null);
      });
    }

    /** Closes the open thread and returns the pane to its empty state. */
    function closeChat() {
      stopChatPolling();
      if (socket) {
        socket.disconnect();
        socket = null;
      }
      socketLive = false;
      shownMessageIds = new Set();
      currentConversationId = null;
      setConnState(false);

      document.getElementById('chatTitle').textContent = 'No conversation selected';
      document.getElementById('chatSub').textContent = '';
      document.getElementById('closeChatBtn').style.display = 'none';
      document.getElementById('messages').innerHTML =
        '<div class="empty">Pick a conversation on the left.</div>';

      const input = document.getElementById('replyBody');
      input.value = '';
      input.disabled = true;
      document.getElementById('sendBtn').disabled = true;

      // Drop the highlight from whichever row was active.
      renderActiveTab();
    }

    /** Sends over the live connection when it is working, over HTTP when not. */
    async function sendReply() {
      const input = document.getElementById('replyBody');
      const body = input.value.trim();
      if (!body || !currentConversationId) return;
      input.value = '';

      if (socketLive && socket) {
        socket.emit('send_message', { conversationId: currentConversationId, body });
        return;
      }

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      try {
        const result = await api(
          '/partner-client-chat/conversations/' + currentConversationId + '/messages',
          { method: 'POST', body: JSON.stringify({ body: body }) },
        );
        // Nothing echoes it back to us without a live connection, so draw it.
        appendMessage(result.data);
        loadConversations({ quiet: true });
      } catch (e) {
        log('SYSTEM', 'Could not send: ' + e.message, null);
        input.value = body;
      } finally {
        sendBtn.disabled = false;
      }
    }

    function setConnState(on) {
      document.getElementById('connState').innerHTML =
        '<span class="dot' + (on ? ' on' : '') + '"></span>' +
        (on ? 'connected' : 'not connected');
    }

    function log(role, body, createdAt, readAt) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      const meta =
        (createdAt ? formatTime(createdAt) : '') +
        (readAt ? ' · read' : '');
      wrap.innerHTML =
        '<div class="bubble">' + escapeHtml(body) + '</div>' +
        '<div class="meta">' + role + (meta ? ' · ' + meta : '') + '</div>';
      const box = document.getElementById('messages');
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
    }

    // --- Tickets -----

    const TICKET_STATUS = { OPEN: 'Open', IN_PROGRESS: 'In progress', RESOLVED: 'Resolved' };
    const TICKET_EVENT = { CREATED: 'Ticket raised', NOTE: 'Update', REOPENED: 'Reopened by partner' };
    const ticketQuery = { status: '', page: 1 };
    let ticketPage = null;
    let currentTicketId = null;
    let ticketCategoriesLoaded = false;

    function statusBadge(s) {
      return '<span class="pill st-' + escapeHtml(s) + '">' + escapeHtml(TICKET_STATUS[s] || s) + '</span>';
    }

    function ticketPartner(p) {
      if (!p) return 'Unknown partner';
      return [p.name, p.businessName].filter(Boolean).join(' / ') + (p.phone ? ' · ' + p.phone : '');
    }

    function ticketClient(c) {
      if (!c) return 'Partner (self)';
      return (c.name || c.phone || 'Client') + (c.clientCode ? ' (' + c.clientCode + ')' : '');
    }

    async function loadTicketCategories() {
      if (ticketCategoriesLoaded) return;
      ticketCategoriesLoaded = true;
      try {
        const result = await api('/support/tickets/categories');
        const select = document.getElementById('ticketCategory');
        (result.data || []).forEach((c) => select.add(new Option(c.label, c.code)));
      } catch (e) {
        ticketCategoriesLoaded = false;
      }
    }

    async function loadTickets(opts = {}) {
      if (opts.status !== undefined) { ticketQuery.status = opts.status; ticketQuery.page = 1; }
      if (opts.page) ticketQuery.page = opts.page;
      loadTicketCategories();
      const params = new URLSearchParams({ page: ticketQuery.page });
      const category = document.getElementById('ticketCategory').value;
      const q = document.getElementById('ticketSearch').value.trim();
      if (ticketQuery.status) params.set('status', ticketQuery.status);
      if (category) params.set('category', category);
      if (q) params.set('q', q);
      try {
        const result = await api('/support/tickets?' + params);
        ticketPage = result.data;
        if (currentTab === 'tickets') renderTickets();
      } catch (e) {
        if (!opts.quiet) renderError(e.message);
      }
    }

    function renderTickets() {
      if (!ticketPage) return;
      const counts = ticketPage.counts || {};
      document.getElementById('ticketFilters').innerHTML = [
        ['', 'All', counts.all], ['OPEN', 'Open', counts.open],
        ['IN_PROGRESS', 'In progress', counts.inProgress], ['RESOLVED', 'Resolved', counts.resolved],
      ].map(([s, label, n]) =>
        '<button class="tab' + (ticketQuery.status === s ? ' active' : '') +
        '" onclick="loadTickets({ status: \'' + s + '\' })">' + label + ' (' + (n || 0) + ')</button>',
      ).join('');

      const list = document.getElementById('list');
      const items = ticketPage.items || [];
      list.innerHTML = items.length ? '' : '<div class="empty">No tickets found.</div>';
      items.forEach((t) => {
        const row = document.createElement('div');
        row.className = 'row' + (t.id === currentTicketId ? ' active' : '');
        row.onclick = () => openTicket(t.id);
        row.innerHTML =
          '<div class="row-main">' +
            '<div class="row-name">' + escapeHtml(t.ticketNo) + ' · ' + escapeHtml(t.categoryLabel || t.category) + '</div>' +
            '<div class="row-sub">' + escapeHtml(ticketPartner(t.partner)) + '</div>' +
            '<div class="row-sub">' + escapeHtml(ticketClient(t.client)) + '</div>' +
            '<div class="row-sub" style="margin-top:2px;">' + statusBadge(t.status) +
              (t.attachmentCount ? ' &#128206; ' + t.attachmentCount : '') +
              ' <span style="color:#9ca3af;">' + formatTime(t.createdAt) + '</span>' +
            '</div>' +
          '</div>';
        list.appendChild(row);
      });

      const page = ticketPage.page || 1;
      const pages = Math.max(1, Math.ceil((ticketPage.total || 0) / (ticketPage.pageSize || 25)));
      const pager = document.createElement('div');
      pager.className = 'panel-head';
      pager.innerHTML =
        '<button onclick="loadTickets({ page: ' + (page - 1) + ' })"' + (page <= 1 ? ' disabled' : '') + '>&lsaquo; Prev</button>' +
        '<span class="status" style="margin:auto;">Page ' + page + ' / ' + pages + ' · ' + (ticketPage.total || 0) + ' tickets</span>' +
        '<button onclick="loadTickets({ page: ' + (page + 1) + ' })"' + (page >= pages ? ' disabled' : '') + '>Next &rsaquo;</button>';
      list.appendChild(pager);
    }

    async function openTicket(id) {
      currentTicketId = id;
      renderTickets();
      try {
        const result = await api('/support/tickets/' + encodeURIComponent(id));
        if (id === currentTicketId) renderTicketDetail(result.data);
      } catch (e) {
        document.getElementById('ticketDetail').innerHTML =
          '<div class="empty" style="color:#dc2626;">' + escapeHtml(e.message) + '</div>';
      }
    }

    function renderTicketDetail(t) {
      document.getElementById('ticketTitle').innerHTML = escapeHtml(t.ticketNo) + ' ' + statusBadge(t.status);
      const events = t.events || [];
      const partner = t.partner || {};
      const eventTitle = (e) => e.title || (e.type === 'STATUS_CHANGED'
        ? 'Status: ' + (TICKET_STATUS[e.fromStatus] || e.fromStatus) + ' → ' + (TICKET_STATUS[e.toStatus] || e.toStatus)
        : TICKET_EVENT[e.type] || e.type);

      document.getElementById('ticketDetail').innerHTML =
        '<p><strong>Category:</strong> ' + escapeHtml(t.categoryLabel || t.category) + '</p>' +
        '<p><strong>Partner:</strong> ' + escapeHtml(ticketPartner(t.partner)) +
          (partner.arn ? ' · ARN ' + escapeHtml(partner.arn) : '') + '</p>' +
        '<p><strong>Client:</strong> ' + escapeHtml(ticketClient(t.client)) +
          (t.client && t.client.phone ? ' · ' + escapeHtml(t.client.phone) : '') + '</p>' +
        '<p><strong>Raised:</strong> ' + formatTime(t.createdAt) + '</p>' +
        (t.status === 'OPEN' && events.some((e) => e.type === 'REOPENED')
          ? '<p><span class="pill st-OPEN">Reopened</span></p>' : '') +
        (t.resolvedByRole === 'PARTNER' ? '<p class="status">Closed by partner</p>' : '') +
        (t.reopenableUntil ? '<p class="status">Partner can reopen until ' + formatTime(t.reopenableUntil) + '</p>' : '') +
        '<div class="desc">' + escapeHtml(t.description) + '</div>' +
        ((t.attachments || []).length
          ? '<div class="thumbs">' + t.attachments.map((a) => !a.url
              ? '<span class="pill">' + escapeHtml(a.fileName) + '</span>'
              : '<a href="' + escapeHtml(a.url) + '" target="_blank" rel="noopener" title="' + escapeHtml(a.fileName) + '">' +
                (String(a.mimeType).startsWith('image/')
                  ? '<img src="' + escapeHtml(a.url) + '" alt="' + escapeHtml(a.fileName) + '" />'
                  : escapeHtml(a.fileName)) + '</a>',
            ).join('') + '</div>'
          : '') +
        '<h4>Timeline</h4>' +
        events.map((e) =>
          '<div class="event">' +
            '<div class="row-name">' + escapeHtml(eventTitle(e)) + '</div>' +
            '<div class="row-sub">' + (e.actorRole === 'SUPPORT' ? 'Support' : 'Partner') + ' · ' + formatTime(e.createdAt) + '</div>' +
            (e.note ? '<div class="desc">' + escapeHtml(e.note) + '</div>' : '') +
          '</div>',
        ).join('') +
        (t.status === 'RESOLVED' ? '' :
          (t.status === 'OPEN'
            ? '<h4>Start work</h4><input id="tkStartTitle" placeholder="Title (optional)" />' +
              '<button class="primary" onclick="ticketAction(\'start\')">Start work</button>'
            : '') +
          '<h4>Post update</h4><input id="tkUpdateTitle" placeholder="Title (optional)" />' +
          '<textarea id="tkUpdateNote" rows="3" placeholder="Note for the partner (required)"></textarea>' +
          '<button onclick="ticketAction(\'update\')">Post update</button>' +
          '<h4>Resolve</h4><textarea id="tkResolveNote" rows="3" placeholder="Resolution note (required)"></textarea>' +
          '<button class="danger" onclick="ticketAction(\'resolve\')">Resolve</button>') +
        '<div id="ticketError" class="err"></div>';
    }

    async function ticketAction(kind) {
      const val = (id) => document.getElementById(id).value.trim();
      const err = (msg) => { document.getElementById('ticketError').textContent = msg; };
      const base = '/support/tickets/' + encodeURIComponent(currentTicketId);
      let path = base + '/status';
      let body;
      if (kind === 'start') {
        body = { status: 'IN_PROGRESS', title: val('tkStartTitle') || undefined };
      } else if (kind === 'update') {
        path = base + '/updates';
        body = { title: val('tkUpdateTitle') || undefined, note: val('tkUpdateNote') };
        if (!body.note) return err('Note is required.');
      } else {
        body = { status: 'RESOLVED', note: val('tkResolveNote') };
        if (!body.note) return err('Resolution note is required.');
        if (!confirm('Resolve this ticket? The partner can reopen it for 48 hours.')) return;
      }
      try {
        const result = await api(path, { method: 'POST', body: JSON.stringify(body) });
        renderTicketDetail(result.data);
        loadTickets({ quiet: true });
      } catch (e) {
        err(e.message);
      }
    }

    // --- Utils ---

    /** Partner label for a row — falls back to a clear "unassigned" marker. */
    function describePartner(partner) {
      if (!partner) return null;
      return partner.name || partner.phone || 'Partner';
    }

    function describeClient(client) {
      if (!client) return 'Unknown client';
      return client.name ? client.name + ' (' + client.phone + ')' : client.phone;
    }

    function formatTime(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    if (token) showMain();
  </script>
</body>
</html>
